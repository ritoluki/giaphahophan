components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __session
      description: Tên logic minh họa; Supabase SSR có thể dùng cookie chunked. Agent đồng bộ tên thực và generated
        docs, không tạo auth song song.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id001
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: *id002
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"v[1-9][0-9]*"$
  schemas:
    Meta:
      type: object
      additionalProperties: false
      properties:
        requestId: *id002
        version: &id008
          type: integer
      required:
      - requestId
    Page:
      type: object
      additionalProperties: false
      properties:
        nextCursor:
          anyOf:
          - *id002
          - type: 'null'
        hasMore: *id007
      required:
      - nextCursor
      - hasMore
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code: *id002
            message: *id002
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: *id002
            requestId: *id002
            retryable: *id007
          required:
          - code
          - message
          - requestId
          - retryable
      required:
      - error
    GenealogyDate:
      type: object
      additionalProperties: false
      properties:
        calendar:
          type: string
          enum:
          - gregorian
          - vietnamese_lunar
          - julian
          - unknown
        precision:
          type: string
          enum:
          - exact
          - month
          - month_day
          - year
          - about
          - before
          - after
          - range
          - text
          - unknown
        year:
          type: integer
          minimum: 1
          maximum: 9999
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        isLeapMonth: *id007
        originalText:
          type: string
          maxLength: 1000
        rangeEnd:
          type: object
          additionalProperties: false
          properties:
            year: *id008
            month: *id008
            day: *id008
          required:
          - year
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
      required:
      - calendar
      - precision
      - originalText
      description: Ngày nguồn không bị suy diễn. Validate cross-field và ngày thực trong domain; không tự gán 01/01.
        Julian chỉ lưu/hiển thị nếu chưa có adapter đã kiểm chứng.
      allOf:
      - if:
          properties:
            precision:
              const: exact
        then:
          required:
          - year
          - month
          - day
      - if:
          properties:
            precision:
              const: month
        then:
          required:
          - year
          - month
      - if:
          properties:
            precision:
              const: year
        then:
          required:
          - year
      - if:
          properties:
            precision:
              const: range
        then:
          required:
          - year
          - rangeEnd
      - if:
          properties:
            calendar:
              const: vietnamese_lunar
        then:
          properties:
            day:
              maximum: 30
      - if:
          properties:
            precision:
              const: month_day
        then:
          required:
          - month
          - day
          not:
            required:
            - year
    Name:
      type: object
      additionalProperties: false
      properties:
