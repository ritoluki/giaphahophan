  /api/v1/invitations/accept:
    post:
      operationId: post_invitations_accept
      tags:
      - Administration
      summary: Accept a single-use invitation into pending membership.
      description: The raw token is hashed at the boundary and is never persisted or returned. The verified account email must match the invitation; acceptance is idempotent and does not activate membership.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptInput'
      responses:
        '200':
          description: Invitation accepted; membership remains pending.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationMutationResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
        '400':
          description: Invalid invitation token payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Verified session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invitation unavailable, expired, revoked, or not bound to this email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Idempotency conflict or existing membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: Idempotency key required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
